name: Update Knowledge Graph Index

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build Knowledge Graph Index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ApenasGabs
        run: node scripts/build-graph-index.mjs src/data/graphIndex.json

      - name: Commit updated graphIndex.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/graphIndex.json
          if git diff --cached --quiet; then
            echo "No graph changes to commit."
          else
            git commit -m "chore(data): update daily knowledge graph index [skip ci]"
            git push
          fi
